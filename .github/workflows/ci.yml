name: CI

on:
  push:
  pull_request:
  # Publication lancée à la main depuis l'onglet Actions : GitHub crée
  # l'étiquette v<version> sur le commit compilé.
  workflow_dispatch:
    inputs:
      version:
        description: Version à publier (par exemple 0.1.0)
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Rapport de la machine de CI
        run: cargo run -p cablescope -- --json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Interface web (embarquée dans l'exécutable)
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p cablescope
      - uses: actions/upload-artifact@v4
        with:
          name: cablescope-windows-x64
          path: target/release/cablescope.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Interface web (embarquée dans l'exécutable)
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # Lié statiquement (musl) : un seul fichier pour toutes les distributions.
      - run: cargo build --release -p cablescope --target x86_64-unknown-linux-musl
      - run: strip target/x86_64-unknown-linux-musl/release/cablescope
      - uses: actions/upload-artifact@v4
        with:
          name: cablescope-linux-x64
          path: target/x86_64-unknown-linux-musl/release/cablescope

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Le modèle et l'audit doivent rester compatibles WebAssembly
        run: cargo check -p cablescope-model -p cablescope-audit -p cablescope-present --target wasm32-unknown-unknown

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de la sonde et APK de CableScope Probe
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cablescope-probe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Une étiquette v… (ou un lancement manuel) publie une version GitHub avec
  # les trois builds, une fois tous les contrôles passés. Rien n'est signé
  # pour l'instant.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, web, windows-exe, linux, wasm, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir publication
          cp artefacts/cablescope-windows-x64/cablescope.exe publication/cablescope-windows-x64.exe
          cp artefacts/cablescope-linux-x64/cablescope publication/cablescope-linux-x64
          cp artefacts/cablescope-probe-apk/app-debug.apk "publication/cablescope-probe-$version.apk"
          gh release create "$TAG" publication/* \
            --target "$GITHUB_SHA" \
            --title "CableScope $version" \
            --notes-file "docs/versions/$version.md"
